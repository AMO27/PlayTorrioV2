name: Build Windows

# Builds PlayTorrio for Windows on GitHub's servers — no local Flutter needed.
# Run it from the repo's Actions tab ("Run workflow"), then download the
# "PlayTorrio-windows" artifact when it finishes.
# Manual only: start it from the Actions tab ("Run workflow").
# Each run is titled with the note typed in "Run workflow" (or passed by
# whoever starts it), so the Actions list shows what was built instead of
# just "Build Windows".
run-name: Windows build — ${{ inputs.title || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      title:
        description: "What's in this build (shown as the run name)"
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub get
      # Same workaround the project's own release workflow (build.yml) uses:
      # download libtorrent_flutter's prebuilt Windows native lib ahead of time
      # so the CMake step doesn't hit its symlink bug.
      - name: Pre-extract libtorrent_flutter native lib
        shell: pwsh
        run: |
          $root = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { "$env:LOCALAPPDATA\Pub\Cache" }
          $pubCache = Join-Path $root "hosted\pub.dev"
          $pkgPath = Get-ChildItem -Path $pubCache -Filter "libtorrent_flutter-*" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($pkgPath) {
            $version = ($pkgPath.Name -split '-')[1]
            $url = "https://github.com/ayman708-UX/libtorrent_flutter/releases/download/v$version/windows-native-lib-x64.zip"
            $zipPath = "$env:TEMP\libtorrent.zip"
            Invoke-WebRequest -Uri $url -OutFile $zipPath
            $prebuiltDir = "$($pkgPath.FullName)\prebuilt\windows"
            New-Item -ItemType Directory -Force -Path $prebuiltDir
            Expand-Archive -Path $zipPath -DestinationPath $prebuiltDir -Force
            Write-Host "Pre-extracted libtorrent_flutter native lib to $prebuiltDir"
          }
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build windows --release
      # yt-dlp is used by the music player to resolve YouTube audio streams.
      - name: Bundle yt-dlp
        shell: pwsh
        run: |
          $base = "https://github.com/yt-dlp/yt-dlp/releases/latest/download"
          $out = "build/windows/x64/runner/Release/yt-dlp.exe"
          Invoke-WebRequest -Uri "$base/yt-dlp.exe" -OutFile $out
          # Verify the download against yt-dlp's own published checksum list,
          # so a tampered or truncated file never ships inside the app.
          Invoke-WebRequest -Uri "$base/SHA2-256SUMS" -OutFile "yt-dlp-sums.txt"
          $line = Get-Content "yt-dlp-sums.txt" | Where-Object { $_ -match '\s\*?yt-dlp\.exe$' } | Select-Object -First 1
          if (-not $line) { throw "yt-dlp.exe not found in SHA2-256SUMS" }
          $expected = ($line -split '\s+')[0].ToLower()
          $actual = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "yt-dlp.exe checksum mismatch ($actual vs $expected)" }
          Write-Host "yt-dlp.exe checksum OK: $actual"
      - uses: actions/upload-artifact@v4
        with:
          name: PlayTorrio-windows
          path: build/windows/x64/runner/Release/
