name: Build Windows

# Builds PlayTorrio for Windows on GitHub's servers — no local Flutter needed.
# Run it from the repo's Actions tab ("Run workflow"), then download the
# "PlayTorrio-windows" artifact when it finishes.
on:
  workflow_dispatch:
  push:
    branches: [fix/shutdown-music-comics]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: PlayTorrio-windows
          path: build/windows/x64/runner/Release/
