name: Build Windows

# Builds PlayTorrio for Windows on GitHub's servers — no local Flutter needed.
# Run it from the repo's Actions tab ("Run workflow"), then download the
# "PlayTorrio-windows" artifact when it finishes.
# Manual only: start it from the Actions tab ("Run workflow").
# Each run is titled with the note typed in "Run workflow" (or passed by
# whoever starts it), so the Actions list shows what was built instead of
# just "Build Windows".
run-name: Windows build — ${{ inputs.title || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      title:
        description: "What's in this build (shown as the run name)"
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub get
      # Same workaround the project's own release workflow (build.yml) uses:
      # download libtorrent_flutter's prebuilt Windows native lib ahead of time
      # so the CMake step doesn't hit its symlink bug.
      - name: Pre-extract libtorrent_flutter native lib
        shell: pwsh
        run: |
          $root = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { "$env:LOCALAPPDATA\Pub\Cache" }
          $pubCache = Join-Path $root "hosted\pub.dev"
          $pkgPath = Get-ChildItem -Path $pubCache -Filter "libtorrent_flutter-*" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($pkgPath) {
            $version = ($pkgPath.Name -split '-')[1]
            $url = "https://github.com/ayman708-UX/libtorrent_flutter/releases/download/v$version/windows-native-lib-x64.zip"
            $zipPath = "$env:TEMP\libtorrent.zip"
            # If this download is missing (the asset was removed or renamed
            # upstream), don't fail here: let the build go on and show the
            # real error from the step that actually needs the file.
            try {
              Invoke-WebRequest -Uri $url -OutFile $zipPath
              $prebuiltDir = "$($pkgPath.FullName)\prebuilt\windows"
              New-Item -ItemType Directory -Force -Path $prebuiltDir
              Expand-Archive -Path $zipPath -DestinationPath $prebuiltDir -Force
              Write-Host "Pre-extracted libtorrent_flutter native lib to $prebuiltDir"
            } catch {
              Write-Host "::warning::Could not pre-download $url ($($_.Exception.Message)); continuing without it"
            }
          }
      # The upstream prebuilt zip for libtorrent_flutter 1.9.9 was removed
      # (404). The package only needs these DLLs in prebuilt/windows/x64, and
      # an earlier good build of this fork has them, so reuse that one.
      - name: Fetch libtorrent native DLLs from an earlier good build
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: PlayTorrio-windows
          run-id: 37705649721
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: oldbuild
      - name: Install libtorrent native DLLs
        shell: pwsh
        run: |
          $root = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { "$env:LOCALAPPDATA\Pub\Cache" }
          $pkg = Get-ChildItem (Join-Path $root "hosted\pub.dev") -Filter "libtorrent_flutter-*" | Select-Object -First 1
          $dest = "$($pkg.FullName)\prebuilt\windows\x64"
          if (Test-Path "$dest\libtorrent_flutter.dll") { Write-Host "Prebuilt already in place"; exit 0 }
          if (-not (Test-Path oldbuild)) { Write-Host "::warning::Earlier build not available; the build will try to compile libtorrent from source"; exit 0 }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $names = 'libtorrent_flutter.dll','torrent-rasterbar.dll','libssl-3-x64.dll','libcrypto-3-x64.dll','boost_*.dll'
          foreach ($n in $names) {
            Get-ChildItem oldbuild -Recurse -File -Filter $n | Where-Object { $_.DirectoryName -eq (Resolve-Path oldbuild).Path } | ForEach-Object { Copy-Item $_.FullName $dest -Force }
          }
          Write-Host "Installed into ${dest}:"
          Get-ChildItem $dest | ForEach-Object { Write-Host "  $($_.Name) $($_.Length)" }
          if (-not (Test-Path "$dest\libtorrent_flutter.dll")) { throw "libtorrent_flutter.dll not found in the earlier build" }
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      # On failure, copy the end of the build log into an annotation so the
      # real error is visible without opening the log.
      - name: Build Windows
        shell: pwsh
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content build.log -Tail 60) -join "`n"
            Write-Host ("::error title=flutter build windows failed::" + (($tail -replace '%','%25') -replace "`r?`n",'%0A'))
            exit $code
          }
      # yt-dlp is used by the music player to resolve YouTube audio streams.
      # Uses yt-dlp's nightly builds: YouTube changes faster than stable
      # releases, and fixes land in nightly first.
      - name: Bundle yt-dlp
        shell: pwsh
        run: |
          $base = "https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download"
          $out = "build/windows/x64/runner/Release/yt-dlp.exe"
          Invoke-WebRequest -Uri "$base/yt-dlp.exe" -OutFile $out
          # Verify the download against yt-dlp's own published checksum list,
          # so a tampered or truncated file never ships inside the app.
          Invoke-WebRequest -Uri "$base/SHA2-256SUMS" -OutFile "yt-dlp-sums.txt"
          $line = Get-Content "yt-dlp-sums.txt" | Where-Object { $_ -match '\s\*?yt-dlp\.exe$' } | Select-Object -First 1
          if (-not $line) { throw "yt-dlp.exe not found in SHA2-256SUMS" }
          $expected = ($line -split '\s+')[0].ToLower()
          $actual = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "yt-dlp.exe checksum mismatch ($actual vs $expected)" }
          Write-Host "yt-dlp.exe checksum OK: $actual"
      - uses: actions/upload-artifact@v4
        with:
          name: PlayTorrio-windows
          path: build/windows/x64/runner/Release/
